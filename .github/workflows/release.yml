name: Publish plugin packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate and build deterministic packages
        run: |
          python3 -m unittest conformance.test_build_packages
          python3 scripts/build_packages.py

      - name: Add stable one-click download names
        run: |
          agent_archive=$(find dist -maxdepth 1 -type f -name 'workslop-detector-agent-plugin-[0-9]*.zip' -print -quit)
          claude_archive=$(find dist -maxdepth 1 -type f -name 'workslop-detector-claude-plugin-[0-9]*.zip' -print -quit)
          cowork_archive=$(find dist -maxdepth 1 -type f -name 'workslop-detector-cowork-skill-[0-9]*.zip' -print -quit)
          test -n "$agent_archive"
          test -n "$claude_archive"
          test -n "$cowork_archive"
          cp "$agent_archive" dist/workslop-detector-agent-plugin.zip
          cp "$claude_archive" dist/workslop-detector-claude-plugin.zip
          cp "$cowork_archive" dist/workslop-detector.zip

      - name: Verify archive contents
        run: |
          python3 -m zipfile --test dist/workslop-detector-agent-plugin-*.zip
          python3 -m zipfile --test dist/workslop-detector-claude-plugin-*.zip
          python3 -m zipfile --test dist/workslop-detector-cowork-skill-*.zip
          python3 -m zipfile --test dist/workslop-detector.zip

      - name: Write checksums
        run: sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --title "Workslop Detector ${{ github.ref_name }}" \
            --verify-tag
